name: Deploy account-web to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/account-web/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/preflight-cloudflare.mjs"
      - "scripts/account-guard.mjs"
      - ".github/workflows/deploy-account.yml"
  workflow_dispatch:

concurrency:
  group: deploy-nl-account-web
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    # ubuntu-latest: avoid single Contabo runner queue blocking account prod deploys
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf .git
          git init
          git fetch --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
      - name: Node 22 and pnpm
        run: bash scripts/ci/use-node-pnpm.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter account-web...

      - name: Cloudflare preflight
        run: node scripts/preflight-cloudflare.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_WORKERS_SUBDOMAIN: ${{ vars.CF_WORKERS_SUBDOMAIN }}

      - name: Build account-web
        run: pnpm --filter account-web run build
        env:
          NODE_ENV: production

      - name: apibay URL builder tests
        run: pnpm --filter account-web run test:apibay

      - name: Install Playwright browsers
        run: pnpm --filter account-web exec playwright install --with-deps chromium

      - name: E2E smoke (static UI)
        run: pnpm --filter account-web run test:e2e

      - name: Ensure Pages project exists
        run: |
          if ! pnpm --filter account-web exec wrangler pages project list | grep -q 'nl-account-web'; then
            pnpm --filter account-web exec wrangler pages project create nl-account-web --production-branch main
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        working-directory: apps/account-web
        # --branch main → production (without it wrangler creates preview-only deploys)
        run: pnpm exec wrangler pages deploy out --project-name=nl-account-web --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
