name: Deploy Web Admin Portal

on:
  push:
    branches: [main]
    paths:
      - "apps/admin-web-portal/**"
      - "workers/admin-web-api/**"
      - "migrations/web-admin/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-admin-web-portal.yml"
  workflow_dispatch:

concurrency:
  group: deploy-nl-web-admin-portal
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: [self-hosted, news-labs, contabo]
    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf .git
          git init
          git fetch --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
      - name: Node 22 and pnpm
        run: bash scripts/ci/use-node-pnpm.sh
      - name: Prepare admin-shell (infra-control-plane)
        run: node scripts/prepare-labs-core.mjs
        env:
          # Override vars.LABS_CORE_REPO if still pointing at retired news-labs/labs-core.
          LABS_CORE_REPO: news-labs/infra-control-plane
          LABS_CORE_CHECKOUT_TOKEN: ${{ secrets.LABS_CORE_CHECKOUT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - name: Cloudflare preflight
        run: node scripts/preflight-cloudflare.mjs
      - name: Provision production D1 (web admin)
        run: node scripts/provision-admin-web-prod.mjs --apply-migrations
      - run: pnpm --filter admin-web-portal run build
      - run: pnpm --filter admin-web-api run deploy
