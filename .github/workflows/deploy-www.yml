name: Deploy marketing-web to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/marketing-web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/preflight-cloudflare.mjs"
      - "scripts/account-guard.mjs"
      - ".github/workflows/deploy-www.yml"
  workflow_dispatch:

concurrency:
  group: deploy-nl-marketing-web
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: [self-hosted, news-labs, contabo]
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf .git
          git init
          git fetch --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
      - name: Node 22 and pnpm
        run: bash scripts/ci/use-node-pnpm.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter marketing-web...

      - name: Cloudflare preflight
        run: node scripts/preflight-cloudflare.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_WORKERS_SUBDOMAIN: ${{ vars.CF_WORKERS_SUBDOMAIN }}

      - name: Build marketing-web
        run: pnpm --filter marketing-web run build
        env:
          NODE_ENV: production

      - name: Deploy to Cloudflare Pages
        working-directory: apps/marketing-web
        run: pnpm exec wrangler pages deploy out --project-name=nl-marketing-web --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
