name: Deploy marketing-web to Cloudflare Pages

# Legacy Cloudflare Pages deploy (old account). Auto-deploy on push is disabled: the site now ships as an
# assets-only Worker built and deployed from project-a (see README.md "배포 (Static hosting)").
# Kept as manual-only until CI is moved to the new account.
on:
  workflow_dispatch:

concurrency:
  group: deploy-nl-marketing-web
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: [self-hosted, news-labs, contabo]
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf .git
          git init
          git fetch --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
      - name: Node 22 and pnpm
        run: bash scripts/ci/use-node-pnpm.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter marketing-web...

      - name: Cloudflare preflight
        run: node scripts/preflight-cloudflare.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_WORKERS_SUBDOMAIN: ${{ vars.CF_WORKERS_SUBDOMAIN }}

      - name: Build marketing-web
        run: pnpm --filter marketing-web run build
        env:
          NODE_ENV: production

      - name: Deploy to Cloudflare Pages
        working-directory: apps/marketing-web
        run: pnpm exec wrangler pages deploy out --project-name=nl-marketing-web --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
