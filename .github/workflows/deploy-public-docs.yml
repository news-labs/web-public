name: Deploy public-docs to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/public-docs/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/preflight-cloudflare.mjs"
      - "scripts/account-guard.mjs"
      - "scripts/audit-public-docs-sensitive.mjs"
      - ".github/workflows/deploy-public-docs.yml"
  workflow_dispatch:

concurrency:
  group: deploy-nl-public-docs
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy user docs
    runs-on: [self-hosted, news-labs, contabo]
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf .git
          git init
          git fetch --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
      - name: Node 22 and pnpm
        run: bash scripts/ci/use-node-pnpm.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter public-docs...

      - name: Cloudflare preflight
        run: node scripts/preflight-cloudflare.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_WORKERS_SUBDOMAIN: ${{ vars.CF_WORKERS_SUBDOMAIN }}

      - name: Audit public-docs for sensitive content
        run: node scripts/audit-public-docs-sensitive.mjs

      - name: Build public-docs
        run: pnpm --filter public-docs run build
        env:
          NODE_ENV: production

      - name: Ensure Pages project exists
        run: |
          if ! pnpm --filter public-docs exec wrangler pages project list | grep -q 'nl-public-docs'; then
            pnpm --filter public-docs exec wrangler pages project create nl-public-docs --production-branch main
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        working-directory: apps/public-docs
        run: pnpm exec wrangler pages deploy dist --project-name=nl-public-docs --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
