# Cloudflare Pages — Newsfork account portal (account.newsfork.com)
# Custom domain: account.newsfork.com

name = "nl-account-web"
pages_build_output_dir = "out"

# BFF → nl-api-gateway account API (/v1/account/*) without leaving Cloudflare.
[[services]]
binding = "GATEWAY"
service = "nl-api-gateway"
